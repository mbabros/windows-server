[windows]
windows-host ansible_host=192.168.1.100 ansible_user=Administrator ansible_port=22 ansible_connection=ssh ansible_shell_type=powershell

[wsl]
wsl-server ansible_host=192.168.1.100 ansible_user=ubuntu ansible_port=2222 ansible_connection=ssh ansible_ssh_extra_args="-o StrictHostKeyChecking=no"

[all:vars]
ansible_python_interpreter=/usr/bin/python3
wsl_distro=Ubuntu-26.04
wsl_ssh_port=2222
immich_image_version=release
immich_photo_path=/mnt/d/ImmichPhotos
immich_backup_sql=/mnt/d/immich_backup_dumpall.sql
