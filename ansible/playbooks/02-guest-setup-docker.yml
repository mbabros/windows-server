---
- name: Configure Ubuntu 26.04 WSL and Install Latest Docker
  hosts: wsl
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache and install base dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - jq
          - htop
          - rsync
        state: present

    - name: Create directory for Docker keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker official repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      register: docker_repo
      ignore_errors: true

    - name: Fallback to noble docker repo if resolute repo not yet published
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker
      when: docker_repo is failed

    - name: Install Docker CE, CLI, and plugins
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Configure iptables-legacy for WSL2 Docker compatibility
      ansible.builtin.shell: |
        update-alternatives --set iptables /usr/sbin/iptables-legacy
        update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy
      changed_when: false

    - name: Ensure Docker systemd override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: Configure Docker systemd drop-in to flush nftables before start
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        mode: '0644'
        content: |
          [Service]
          ExecStartPre=/usr/sbin/nft flush ruleset
      notify: Reload systemd

    - name: Enable and start Docker systemd service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Verify Docker is functional
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "Docker is running: {{ docker_info.stdout_lines[0] | default('OK') }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
